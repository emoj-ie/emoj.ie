# GitHub-hosted Astro build/deploy — manual break-glass only.
#
# Purpose: emergency fallback for publishing the site if the local release
# controller is unavailable. It is retained, deliberately dispatch-only, until
# `gh-pages` branch publishing from the local release controller has been
# verified in production; per the CI-alignment contract it is removed at that
# point.
#
# Normal path: the release controller checks out the approved `main` SHA on
# project-controlled hardware, re-runs `node utils/ci/run-local-ci.mjs`, and
# publishes the resulting `astro-site/dist` contents (including `.nojekyll`)
# to the `gh-pages` branch. GitHub performs no application build or test work.
#
# This workflow MUST NOT be given a `push` or `pull_request` trigger.
name: Deploy to GitHub Pages (manual break-glass)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install, build, and upload
        uses: withastro/action@v5
        with:
          path: ./astro-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
