# Legacy hosted Astro build/deploy — manual fallback only, pending removal.
#
# Production is published by the local release controller: it checks out the
# approved `main` SHA, repeats the local build and validation with
# `utils/ci/run-local-ci.mjs`, and publishes the resulting static `dist`
# (including `.nojekyll`) to the `gh-pages` branch. GitHub performs no
# application build or test work.
#
# The `push: main` trigger is removed so merging never spends GitHub-hosted
# build minutes. This file is retained ONLY as a rollback path until GitHub
# Pages is switched to publish the root of `gh-pages` and branch publishing is
# verified; per the issue contract it is deleted at that point.
name: Deploy to GitHub Pages (legacy fallback)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install, build, and upload
        uses: withastro/action@v5
        with:
          path: ./astro-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
