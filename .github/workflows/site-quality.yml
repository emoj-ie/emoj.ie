# LEGACY — manual-only. Retained for one purpose and one purpose only:
# ad-hoc inspection of the pre-Astro root site (index.html, script.js, utils/qa)
# on a machine that is not the Dell worker.
#
# It MUST NOT run automatically. Pull-request and push validation for this
# repository is performed exclusively by the local dispatcher:
#
#   node utils/ci/run-local-ci.mjs --repository <owner/repo> --issue-number <n> \
#     --head-sha <sha> --correlation-id <id> --evidence-dir <absolute-path>
#
# The HP control plane publishes the required `ai-company/local-ci` status from
# the evidence manifest that command produces. Adding `pull_request` or `push`
# triggers back to this file re-introduces GitHub-hosted CI and violates the
# operating model (see docs/OPERATING_MODEL.md).

name: legacy-site-quality (manual only)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this legacy root-site check is being run manually
        required: true
        type: string

permissions:
  contents: read

jobs:
  legacy-root-site-quality:
    # Not a required check. Never gates a pull request.
    runs-on: ubuntu-latest

    steps:
      - name: Record reason
        run: 'echo "Manual legacy run — reason: ${{ inputs.reason }}"'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Check
        run: npm run build:check

      - name: Unit And Integration Tests
        run: npm test

      - name: Broken Link Scan
        run: npm run lint:links

      - name: Accessibility Smoke
        run: npm run test:a11y-smoke

      - name: Playwright Smoke
        run: npm run test:playwright-smoke

      - name: Lighthouse Budgets
        run: npm run test:lighthouse-budget
