version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        # Explicit selector: without `patterns` the group's membership is left
        # to Dependabot's default, and a group that matches nothing silently
        # produces one PR per dependency instead of the single bundled PR.
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
